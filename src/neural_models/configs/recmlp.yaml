seed: 42
batch_size: 2048
epochs: 10
model_save_path: checkpoints/
num_workers: 6
pin_memory: true

train_dataset:
  _target_: neural_models.dataset.NonogramsDataset
  file_name: 5x5-700_000-train.jsonl
  max_size: 10000
  padding_type: "positional"

val_dataset:
  _target_: neural_models.dataset.NonogramsDataset
  file_name: 5x5-100_000-val.jsonl
  max_size: 1000
  padding_type: "positional"

model:
  _target_: neural_models.models.recursive_mlp.RecursiveMLP
  hidden_size: 256
  num_layers: 9
  dropout: 0.3
  sigmoid_output: false
# model:
#   _target_: neural_models.models.recursive_grid_mlp.RecursiveGridMLP
#   hidden_size: 256
#   num_layers: 9
#   dropout: 0.3
#   sigmoid_output: false

criterion:
  _target_: neural_models.criterions.AbstainLoss
  abstain_penalty: 0.2
  # entropy_weight: 0.1
# criterion:
#   _target_: neural_models.criterions.MSELoss

optimizer:
  _target_: torch.optim.Adam
  lr: 1e-3
  weight_decay: 1e-5

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 100

logger:
  _target_: neural_models.logger.Logger
  enabled: false
  log_every: 1
  project: nonograms_5x5
  name: null
  group: null
  tags: []
  should_log_model: true
  save_code: true
  log: gradients
  log_freq: 200
