# config/classifier.yaml
# Copy data_dir / input / puzzle_filter / max_size from your imitation.yaml if they differ.
data_dir: data
input: base_1000.jsonl      # TODO: same file name as in imitation.yaml
solvers: null            # null = every solver in the file
max_size: null           # max number of puzzles to load
puzzle_filter: null

seed: 0
k: 20                    # every trace is resampled to k steps
val_frac: 0.2            # fraction of *puzzles* held out for validation
epochs: 200
batch_size: 128
model_save_path: checkpoints/classifier

model:
  _target_: trace_comparison.training.classifier.MLPClassifier
  hidden: 256

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3
  weight_decay: 1.0e-2

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${epochs}