# Dense-resample the jagged traces, then 1 - RMSE between every solver pair.
blocks:
  - _target_: trace_comparison.blocks.resample.Resample
    k: 20
  # - _target_: trace_comparison.blocks.leace.LEACENormaliser
  - _target_: trace_comparison.blocks.normalise.Normaliser
    mode: rank
  - _target_: trace_comparison.blocks.cka.CKASimilarity

input: base_1000.jsonl
solvers: null # null -> every solver in the file, in order of first appearance
max_size: null
puzzle_filter: all_solved # all_solved | null
data_dir: ${oc.env:DATA_DIR,./data}
output_file: cka_temp.csv
seed: 42
