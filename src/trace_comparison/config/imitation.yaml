# Autoregressive imitation models: clues -> solver trace cells, one model per solver run.
seed: 42
data_dir: ${oc.env:DATA_DIR,./data}
input: base_1000.jsonl
solvers: null # null -> every solver run key in the file
puzzle_filter: null # all_solved | null
max_size: null
max_steps: 50 # cap trace length (sequences are step x H x W cells)
train_fraction: 0.8
batch_size: 128
epochs: 10
num_workers: 4
pin_memory: true
model_save_path: checkpoints/imitation

model:
  _target_: trace_comparison.training.imitation.ImitationGPT2
  n_embd: 128
  n_layer: 4
  n_head: 4
  dropout: 0.1

optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  weight_decay: 1.0e-2

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${epochs}
