gd_sgd:
  name: gd_sgd
  seeds: [1]
  strategy:
    _target_: puzzle_solvers.solvers.gradient_descent.GDStrategy
    loss_fn:
      _target_: puzzle_solvers.losses.line_automata_loss.LineAutomatonLoss
  state:
    _target_: puzzle_solvers.solvers.gradient_descent.GDSGDState
    k: 1
    lr: 1.0
  aggregator:
    _target_: puzzle_solvers.aggregation.FirstAggregator
    unknown_handling: replace
