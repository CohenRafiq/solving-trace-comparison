defaults:
  # A config group: every entry nests under its own key in `cfg.solvers`, so
  # two solvers never step on each other's `strategy` / `state` / `aggregator`.
  # Select from the CLI with e.g. 'solvers=[ac_parallel,gd_adam]'.
  - solvers: [ac_population, ac_parallel, backtracking_population, backtracking_search, gd_adam, gd_adam_population, gd_sgd, genetic_rank, genetic_tournament, nn_recursive_mlp]
  - _self_

data_dir: ${oc.env:DATA_DIR,./data}
input: 5x5-200_000-test.jsonl
output: test.jsonl
max_size: 5
max_time: 2.0
batch_size: 10
workers: null
chunksize: null
seed: null

dataset:
  _target_: neural_models.dataset.NonogramsDataset
  padding_type: positional

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}