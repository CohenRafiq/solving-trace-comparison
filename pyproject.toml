[project]
authors = [{name = "CohenRafiq", email = "cohen.rafiq@gmail.com"}]
name = "CompactReasoningModels"
requires-python = ">= 3.11, < 3.14"
version = "0.1.0"
dependencies = ["kymatio>=0.3.0,<0.4", "cka-pytorch>=1.1.3,<2", "stable-baselines3>=2.9.0,<3", "umap-learn>=0.5.12,<0.6"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_models", "src/puzzle_solvers", "src/trace_comparison", "src/utils", "src/base_dataset"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
hydra-core = ">=1.3.2,<2"
ipykernel = ">=7.2.0,<8"
jupyter = ">=1.1.1,<2"
matplotlib = ">=3.10.9,<4"
numpy = ">=2.4.3,<4"
omegaconf = ">=2.3.0,<3"
pandas = ">=3.0.2,<4"
pyarrow = ">=24.0.0,<25"
scikit-learn = ">=1.8.0,<2"
seaborn = ">=0.13.2,<0.14"
statsmodels = ">=0.14.6,<0.15"
transformers = ">=5.9.0,<6"
wandb = ">=0.25.1,<0.26"
scikit-image = ">=0.26.0,<0.27"
nbstripout = ">=0.9.1,<0.10"
gymnasium = ">=1.3.0,<2"

[tool.pixi.pypi-dependencies]
CompactReasoningModels = { path = ".", editable = true }
mypy = ">=1.11"
pandas-stubs = ">=2.2"
pytest = ">=8.0"
ruff = ">=0.6"
scipy-stubs = ">=1.15"
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu128" }

[tool.pixi.tasks]
lint = "ruff check src"
format = "ruff format src"
type-check = "mypy src"
test = "pytest src -q"
train = "python src/neural_models/train.py"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/notebooks", "**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
